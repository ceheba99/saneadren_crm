<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Reloj checador · Saneadren</title>
<!-- Se puede instalar como app en la tableta (Chrome → «Instalar app»): abre en pantalla completa y en horizontal. -->
<link rel="manifest" href="/kiosco.webmanifest">
<meta name="theme-color" content="#1a1d23">
<link rel="icon" href="/kiosco-icono-192.png">
<!-- KIOSCO DEL RELOJ CHECADOR (server/checador.js, F2 2026-11-03). Se abre en /kiosco en la tableta o computadora de la
     entrada, que antes registró el gerente desde Personal (su token queda en este navegador). Sin sesión del CRM: solo
     checa, y al abrir cierra la sesión del CRM que haya en este navegador (y la de cualquier pestaña que entre después). La hora la pone el servidor; la que se ve aquí es solo de referencia.
     Sin internet: la checada (con su foto) se guarda en este navegador (IndexedDB) y se sube al volver la conexión; el
     servidor revisa el PIN al subirla y la deja «por revisar». El script va aquí mismo (la CSP permite scripts en línea). -->
<style>
  :root{--oscuro:#1a1d23;--amarillo:#f6b103;--texto:#1f2937;--sec:#6b7280;--linea:#e5e7eb;--fondo:#f4f5f7;--verde:#15803d;--rojo:#b91c1c;--azul:#1d4ed8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overscroll-behavior:none;} /* sin «jalar para recargar»: una recarga a medias dejaba la pantalla en blanco */
  .arranque{text-align:center;padding:30px 10px;}.arranque h1{font-size:1.5rem;margin:0 0 8px;}.arranque p{color:#4b5563;margin:0 0 16px;}.arranque a,.arranque button{display:inline-block;font-size:1.15rem;font-weight:700;padding:14px 26px;border-radius:12px;border:0;background:#f6b103;color:#1a1d23;text-decoration:none;}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto);display:flex;flex-direction:column;user-select:none;}
  header{background:var(--oscuro);color:#fff;padding:12px 16px;border-bottom:4px solid var(--amarillo);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  header img{height:38px;display:block;}
  /* Reloj grande al centro (pedido de Dirección, 2026-11-04): se ajusta al ancho y al alto para no tapar el teclado. */
  .hora{text-align:center;padding:14px 16px 0;}
  #reloj{font-size:clamp(3.5rem,min(16vw,12vh),9rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--oscuro);}
  #fecha{color:var(--sec);font-size:clamp(1.1rem,min(3.6vw,3vh),1.8rem);margin-top:6px;}
  #fecha::first-letter{text-transform:uppercase;}
  #kiosco-nombre{color:#d1d5db;font-size:.9rem;}
  #avisos{display:flex;flex-direction:column;gap:6px;padding:8px 16px 0;}
  .aviso{border-radius:10px;padding:10px 14px;font-size:1rem;}
  button.aviso{font:inherit;text-align:left;width:100%;cursor:pointer;}
  .aviso.rojo{background:#fde8e8;color:var(--rojo);border:1px solid #f5b5b5;}
  .aviso.amarillo{background:#fff7d6;color:#7a5600;border:1px solid #e6c34a;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;}
  .pantalla{width:100%;max-width:560px;text-align:center;}
  h1{font-size:1.8rem;margin:0 0 6px;}
  .ayuda{color:var(--sec);font-size:1.05rem;margin:0 0 16px;}
  .puntos{display:flex;justify-content:center;gap:16px;margin:10px 0 18px;}
  .puntos span{width:26px;height:26px;border-radius:50%;border:3px solid var(--oscuro);}
  .puntos span.lleno{background:var(--oscuro);}
  .digitos{font-size:2.4rem;font-weight:700;letter-spacing:.4em;min-height:3rem;margin:6px 0 14px;font-variant-numeric:tabular-nums;}
  .teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:0 auto;}
  .teclado button,.botones button,.btn{font:inherit;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;}
  .teclado button{font-size:2rem;font-weight:600;padding:18px 0;background:#fff;border:2px solid var(--linea);color:var(--texto);}
  .teclado button:active{background:#e5e7eb;}
  .teclado .secundario{font-size:1.1rem;color:var(--sec);}
  .botones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  /* Mis servicios (2026-11-11): las órdenes asignadas a quien se identificó. */
  .servicios{text-align:left;margin-top:16px;}
  .servicios h2{font-size:1.15rem;margin:0 0 6px;}
  .servicios .dia,.cal-lista .dia{font-weight:700;color:var(--sec);margin:12px 0 4px;}
  .servicios .dia::first-letter,.cal-lista .dia::first-letter{text-transform:uppercase;}
  .servicio{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--amarillo);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:1rem;line-height:1.35;}
  .servicio b{font-size:1.08rem;}
  .servicio .acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .servicio .acciones button{font:inherit;font-size:.95rem;border:1px solid var(--linea);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;}
  .servicio .acciones .mal{color:var(--rojo);font-size:.9rem;}
  .servicio small{display:block;color:var(--sec);}
  .servicios-lista{max-height:46vh;overflow:auto;}
  /* Avisos (2026-11-11) */
  .avisos{text-align:left;margin:10px 0 14px;}
  .avisos h2{font-size:1.1rem;margin:0 0 6px;}
  .avisos .aviso{border:2px solid #f6b103;background:#fffbeb;border-radius:12px;padding:10px 12px;margin:8px 0;color:#1a1d23;}
  .avisos .aviso.urgente{border-color:#dc2626;background:#fef2f2;}
  .avisos .aviso.leido{opacity:.6;}
  .avisos .aviso p{white-space:pre-line;margin:6px 0;}
  .avisos .aviso small{display:block;color:#6b7280;margin-bottom:6px;}
  .avisos .aviso button{min-height:44px;padding:8px 16px;}
  .avisos .aviso button.hecho{background:#16a34a;color:#fff;border-color:#16a34a;}
  /* Calendario de servicios (2026-11-11): lo ve cualquiera; para imprimir se pide código y PIN. */
  .abajo-inicio{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px;}
  .btn-calendario{font-size:1.05rem;padding:12px 18px;background:#fff;border:2px solid var(--linea);color:var(--texto);}
  .cal-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:6px 0 10px;}
  .cal-dias button{font:inherit;font-size:.92rem;border:2px solid var(--linea);background:#fff;border-radius:12px;padding:8px 4px;cursor:pointer;line-height:1.25;}
  .cal-dias button[aria-pressed="true"]{border-color:var(--amarillo);background:#fff7d6;font-weight:700;}
  .cal-dias small{display:block;color:var(--sec);}
  .cal-lista{text-align:left;max-height:52vh;overflow:auto;}
  .cal-nav{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .botones button{font-size:1.25rem;font-weight:700;padding:22px 10px;background:#fff;border:3px solid var(--linea);color:var(--texto);}
  .botones button.sugerido{background:var(--amarillo);border-color:#c98f00;color:#1a1d23;}
  .btn{font-size:1.1rem;padding:14px 22px;background:#fff;border:2px solid var(--linea);color:var(--texto);margin-top:16px;}
  /* Ventana grande de la cámara mientras se toma la cara (registrar o comprobar): ocupa toda la pantalla para verse
     bien y se cierra sola al terminar (2026-11-05). */
  .ventana-cara{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;}
  .ventana-cara video{flex:1;min-height:0;width:100%;object-fit:cover;transform:scaleX(-1);}
  .ventana-cara .vc-arriba,.ventana-cara .vc-abajo{position:absolute;left:0;right:0;padding:18px 20px;text-align:center;color:#fff;background:rgba(0,0,0,.55);}
  .ventana-cara .vc-arriba{top:0;}
  .ventana-cara .vc-abajo{bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .ventana-cara h1{margin:0;font-size:1.6rem;color:#fff;}
  .ventana-cara .vc-aviso{font-size:2rem;font-weight:800;color:var(--amarillo);margin:0;line-height:1.2;}
  .ventana-cara .vc-guia{position:absolute;top:50%;left:50%;width:min(62vw,62vh);aspect-ratio:3/4;transform:translate(-50%,-50%);border:4px dashed rgba(246,177,3,.9);border-radius:50%;pointer-events:none;}
  .ventana-cara .btn{margin-top:0;background:rgba(255,255,255,.92);}
  .ventana-cara .vc-guia.bien{border:6px solid #22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.25);}
  .ventana-cara .vc-paso{margin:6px 0 0;font-size:1.05rem;color:#fff;opacity:.9;}
  .ventana-cara .vc-barra{width:min(520px,80vw);height:14px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden;}
  .ventana-cara .vc-barra i{display:block;height:100%;width:0;background:var(--amarillo);border-radius:8px;transition:width .2s;}
  .ventana-cara .vc-barra.toma i{background:#22c55e;}
  .ventana-cara .vc-botones{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .reintento .icono{font-size:3rem;}
  .reintento h1{color:var(--texto);}
  .consejos{text-align:left;margin:0 auto 6px;padding-left:22px;max-width:440px;font-size:1.05rem;line-height:1.5;}
  .reintento-botones{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .reintento-botones .btn{margin-top:0;font-size:1.2rem;padding:16px 22px;}
  .btn-principal{background:var(--amarillo);border-color:var(--amarillo);font-weight:800;}
  .ventana-cara .vc-sin{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;}
  .camara{position:relative;width:min(100%,440px);aspect-ratio:4/3;max-height:42vh;margin:0 auto 6px;border-radius:12px;overflow:hidden;background:#111;}
  /* Pantalla de los botones: en tableta horizontal, la cámara grande a la izquierda y los botones a la derecha. */
  .pantalla.ancha{max-width:1100px;}
  @media (min-width:800px) and (orientation:landscape){
    .checar{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:center;}
    .checar .camara{width:100%;max-height:58vh;margin:0;}
    .checar .botones{margin-top:0;}
  }
  .btn-chico{font-size:.95rem;padding:10px 16px;margin-top:12px;color:var(--sec);}
  .btn-credencial{font:inherit;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;margin:0 0 12px;background:#fff;border:3px dashed var(--amarillo);border-radius:16px;color:var(--texto);cursor:pointer;touch-action:manipulation;}
  .btn-credencial .icono{font-size:3.2rem;line-height:1;}
  .btn-credencial b{font-size:1.35rem;}
  .btn-credencial small{color:var(--sec);font-size:1rem;}
  .btn-credencial:active{background:#fff7d6;}
  .camara video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  .camara.sin video{display:none;}
  .camara .sin-cam{display:none;color:#fff;font-size:.9rem;padding:20px;}
  .camara.sin .sin-cam{display:block;}
  .listo .icono{font-size:5rem;line-height:1;}
  .listo.ok h1{color:var(--verde);}
  .listo.guardada h1{color:#7a5600;}
  .error h1{color:var(--rojo);}
  #pendientes{position:fixed;left:12px;bottom:10px;font-size:.9rem;color:var(--sec);}
  #aviso-privacidad{position:fixed;right:150px;bottom:14px;font-size:.85rem;color:var(--sec);}
  #pantalla-completa{position:fixed;right:12px;bottom:10px;font:inherit;font-size:.85rem;color:var(--sec);background:none;border:1px solid var(--linea);border-radius:8px;padding:6px 10px;}
  [hidden]{display:none!important;}
  @media (display-mode:fullscreen),(display-mode:standalone){#pantalla-completa{display:none;}#aviso-privacidad{right:12px;}}
  @media (max-width:520px){.teclado button{padding:14px 0;font-size:1.7rem;}.botones button{font-size:1.05rem;padding:18px 6px;}}
  /* Tableta: controles amplios, información del dispositivo y estados legibles. */
  body{background:radial-gradient(ellipse at 50% 0,#fff8df 0,transparent 52%),#f3f5f7;min-height:100%;height:auto;}
  header{background:#fff;color:var(--texto);border-bottom:1px solid var(--linea);padding:12px 28px;flex-shrink:0;}
  .marca-checador{display:flex;align-items:center;gap:20px;}
  header img{height:42px;max-width:210px;object-fit:contain;}
  .marca-titulo{border-left:1px solid var(--linea);padding-left:20px;}
  .marca-titulo strong{display:block;font-size:1rem;}
  #kiosco-nombre{color:var(--sec);margin-top:3px;font-size:.8rem;}
  .dispositivo-estados{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .estado-dispositivo{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--linea);border-radius:10px;background:#f8fafc;font-size:.82rem;font-weight:600;min-height:38px;}
  button.estado-dispositivo{font:inherit;font-size:.82rem;cursor:pointer;color:var(--texto);touch-action:manipulation;}
  .conexion-punto{width:7px;height:7px;border-radius:50%;background:#94a3b8;}
  #conexion[data-estado="en-linea"] .conexion-punto{background:var(--verde);}
  #conexion[data-estado="sin-conexion"]{background:#fff5e6;border-color:#f6d29a;color:#8a4b00;}
  #conexion[data-estado="sin-conexion"] .conexion-punto{background:#d97706;}
  .bateria-icono{position:relative;width:24px;height:13px;border:1.5px solid currentColor;border-radius:3px;display:inline-block;}
  .bateria-icono::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;border-radius:0 1px 1px 0;background:currentColor;}
  .bateria-nivel{position:absolute;inset:2px;right:auto;width:calc(var(--nivel,0) * 17px);background:currentColor;border-radius:1px;}
  #bateria[data-estado="cargando"]{color:#166534;background:#f0fdf4;border-color:#c6e8cf;}
  #bateria[data-estado="baja"]{color:#92400e;background:#fffbeb;border-color:#f2d58e;}
  #bateria[data-estado="critica"]{color:#b91c1c;background:#fff1f2;border-color:#fecdd3;}
  #bateria[data-estado="no-disponible"]{color:var(--sec);}
  .hora{padding:18px 20px 8px;}
  .hora-etiqueta{font-size:.68rem;letter-spacing:.18em;font-weight:700;color:var(--sec);margin-bottom:7px;}
  #reloj{font-size:clamp(3.5rem,min(12vw,10vh),6rem);letter-spacing:-.035em;}
  #fecha{font-size:1rem;margin-top:6px;}
  #avisos{width:100%;max-width:1100px;margin:0 auto;padding:0 24px;}
  #bateria-aviso{max-width:1052px;margin:8px auto 0;padding:10px 16px;border-radius:10px;background:#fffbeb;color:#92400e;border:1px solid #f2d58e;font-size:.9rem;}
  #bateria-aviso.critica{background:#fff1f2;border-color:#fecdd3;color:#b91c1c;}
  main{padding:16px 24px 20px;}
  .pantalla{max-width:560px;background:#fff;border:1px solid #e1e5ea;border-radius:24px;padding:24px;box-shadow:0 8px 28px #1a1d2308;border-top:3px solid var(--amarillo);}
  .pantalla.ancha{max-width:1052px;}
  h1{font-size:1.5rem;line-height:1.25;}
  .ayuda{font-size:.96rem;line-height:1.45;margin-bottom:14px;}
  .teclado{gap:8px;max-width:360px;}
  .teclado button{font-size:1.7rem;padding:12px 0;min-height:58px;border:1px solid #dce2e8;border-radius:12px;background:#f8fafc;box-shadow:0 2px 0 #e5e7eb;}
  .teclado button:active{background:#fff3c7;border-color:#e6af1a;box-shadow:none;transform:translateY(1px);}
  button:focus-visible,a:focus-visible{outline:3px solid var(--azul);outline-offset:3px;}
  .digitos{margin:8px auto 12px;letter-spacing:.35em;font-size:2rem;min-height:2.7rem;}
  .puntos{margin:12px 0 18px;gap:14px;}
  .puntos span{width:20px;height:20px;border-width:2px;}
  .btn-credencial{background:#fffbeb;border:1px solid #f1d77f;border-radius:18px;padding:36px 20px;margin:0;min-height:230px;justify-content:center;gap:12px;}
  .btn-credencial .icono{display:grid;place-items:center;width:78px;height:78px;background:#f6b103;border-radius:22px;font-size:2.6rem;}
  .btn-credencial small{max-width:220px;line-height:1.5;font-size:.9rem;}
  .botones button{border-width:1px;font-size:1.12rem;padding:20px 12px;border-radius:14px;min-height:76px;text-align:left;}
  .botones button.sugerido{border:2px solid #d59b00;box-shadow:0 4px 12px #f6b10330;}
  .btn-chico{background:transparent;border:0;font-size:.82rem;margin-top:12px;padding:8px;}
  .listo{padding:24px 12px;}
  .listo .icono{margin-bottom:16px;}
  .listo h1{font-size:2rem;}
  .kiosco-pie{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px 16px;flex-wrap:wrap;}
  #pendientes,#aviso-privacidad,#pantalla-completa{position:static;font-size:.8rem;}
  #pendientes{flex:1;min-width:170px;}
  #pendientes[data-pendientes="true"]{color:#92400e;font-weight:600;}
  #pantalla-completa{background:#fff;padding:8px 12px;}
  @media(min-width:800px) and (orientation:landscape){
    .ingreso .checar{grid-template-columns:.9fr 1fr;gap:48px;}
    .checar .camara{max-height:40vh;}
  }
  @media(max-height:820px) and (min-width:700px){
    header{padding:8px 24px;}header img{height:34px;}.hora{padding:10px 16px 4px;}#reloj{font-size:3.8rem;}
    main{padding-top:10px;padding-bottom:10px;}.pantalla{padding:18px 24px;}.teclado button{min-height:46px;padding:7px 0;}
    .btn-credencial{min-height:210px;}.kiosco-pie{padding-top:4px;padding-bottom:8px;}
  }
  @media(max-width:799px){.marca-titulo{border:0;padding:0;}.marca-checador{gap:12px;}header{padding:12px 16px;}header img{height:32px;}main{padding:12px;}.pantalla{padding:20px;}.btn-credencial{min-height:0;padding:18px;margin-bottom:22px;}.btn-credencial .icono{width:48px;height:48px;font-size:1.8rem;border-radius:14px;}.kiosco-pie{padding:10px 16px;}#bateria-aviso{margin:8px 12px 0;}.dispositivo-estados{gap:6px;}}
  @media(max-width:420px){.marca-titulo strong{font-size:.85rem;}.estado-dispositivo{font-size:.75rem;padding:8px;}.marca-titulo{max-width:170px;}header{gap:10px;}.dispositivo-estados{width:100%;justify-content:space-between;}.teclado button{min-height:52px;}.botones button{font-size:.95rem;}}
</style>
</head>
<body>
<header>
  <div class="marca-checador"><img src="/logo-saneadren.png" alt="Saneadren"><div class="marca-titulo"><strong>Reloj checador</strong><div id="kiosco-nombre"></div></div></div>
  <div class="dispositivo-estados" aria-label="Estado del dispositivo">
    <button type="button" id="sonido" class="estado-dispositivo" aria-pressed="true">♪ Sonido activado</button>
    <div id="conexion" class="estado-dispositivo" data-estado="conectando" role="status"><span class="conexion-punto" aria-hidden="true"></span><span id="conexion-texto">Conectando…</span></div>
    <div id="bateria" class="estado-dispositivo" data-estado="no-disponible" role="status"><span class="bateria-icono" aria-hidden="true"><span id="bateria-nivel" class="bateria-nivel"></span></span><span id="bateria-texto">Leyendo batería…</span></div>
  </div>
</header>
<div class="hora"><div class="hora-etiqueta">REGISTRO DE ASISTENCIA</div><div id="reloj" aria-live="off">--:--</div><div id="fecha"></div></div>
<div id="avisos" role="status"></div>
<div id="bateria-aviso" role="status" hidden></div>
<main><div class="pantalla" id="pantalla"><div class="arranque" id="arranque"><h1>Iniciando el reloj checador…</h1><p>Si no avanza en unos segundos, toca el botón.</p><a href="/kiosco">Reintentar</a></div></div></main>
<div class="camara-oculta" hidden><video id="video" autoplay playsinline muted></video><canvas id="lienzo" width="480" height="360"></canvas></div>
<footer class="kiosco-pie"><div id="pendientes" role="status"></div>
<button type="button" id="pantalla-completa">Pantalla completa</button>
<a id="aviso-privacidad" href="/aviso-privacidad-checador.html" target="_blank" rel="noopener">Aviso de privacidad</a></footer>
<script>
/* VIGILANTE (2026-11-11, Dirección: «quiero que sea realmente a prueba de errores»). Va en su propio bloque y no usa nada
   del programa del kiosco: si aquel falla, se queda a medias o deja la pantalla vacía (al volver del bloqueo, con el
   ahorro de energía o tras muchas recargas), este lo nota y lo recupera solo: primero pide al programa que vuelva al
   inicio; si no puede, recarga la página (espaciando los intentos: 0, 5, 15, 30 y 60 s) y siempre deja un botón. */
(function () {
  var LLAVE = 'saneadren_kiosco_vigia', DIAG = 'saneadren_kiosco_diag', cargado = Date.now(), vaciaDesde = 0, recuperando = false, oculto = 0;

      let fallas = 0;
      for (const x of items) {
        const mismaSesion = x.sesion === SESION;
        const edad = Math.max(0, Math.round(mismaSesion ? performance.now() - x.p0 : Date.now() - x.t0));
        let r;
        try { r = await api('sin-conexion', { uid: x.uid, codigo: x.codigo, ...(x.secreto ? { secreto: x.secreto } : x.rostro && !x.pin ? { rostro: x.rostro } : { pin: x.pin }), tipo: x.tipo, foto: x.foto, edad_ms: edad, monotonica: mismaSesion, hora_dispositivo: new Date(x.t0).toISOString() }); }
        catch { sinConexion = true; avisos(); break; }
        if (r.status === 401 && r.j.codigo === 'KIOSCO_NO_REGISTRADO') break;
        if (r.ok || r.j.descartar) { await cola('readwrite', s => s.delete(x.uid)); if (!r.ok) rechazadas++; fallas = 0; continue; }
        if (r.status === 429) break; // el servidor pide esperar
        x.intentos = (x.intentos || 0) + 1; await cola('readwrite', s => s.put(x));
        if (++fallas >= 5) break;
      }
    } catch { /* sin IndexedDB */ }
    subiendo = false; contarPendientes();
  }

  // ---------- Arranque ----------
  // Para que abra aunque la tableta se reinicie sin internet (solo la página del kiosco; ver kiosco-sw.js).
  try { navigator.serviceWorker?.register('/kiosco-sw.js', { scope: '/kiosco' }).catch(() => {}); } catch { /* no disponible */ }
  $('pantalla-completa').onclick = () => { (document.documentElement.requestFullscreen?.() || Promise.resolve()).catch(() => {}); };
  // La pantalla no se apaga sola: el permiso se pierde cada vez que la tableta se bloquea, así que se vuelve a pedir.
  // 2026-11-13 (la tableta se bloqueó sola y pedía su PIN): si el sistema no deja mantener la pantalla encendida
  // (ahorro de energía, batería baja), el checador lo dice en un aviso amarillo, lo reintenta cada 15 s y con cada
  // toque, y se lo reporta al servidor para que avise a Dirección ANTES de que la pantalla se apague.
  let candado = null;
  const despierta = async () => {
    if (candado || document.visibilityState !== 'visible') return;
    if (!navigator.wakeLock?.request) { if (pantallaFija !== null) { pantallaFija = null; avisos(); } return; }
    let ok = false;
    try { candado = await navigator.wakeLock.request('screen') || null; ok = !!candado; candado?.addEventListener('release', () => { candado = null; setTimeout(despierta, 1000); }); } catch { candado = null; }
    if (pantallaFija !== ok) { pantallaFija = ok; avisos(); }
  };
  setInterval(() => { if (!candado) despierta(); }, 15000);
  document.addEventListener('pointerdown', () => { if (!candado) despierta(); }, { capture: true, passive: true });
  // ---------- Volver a la vida (2026-11-11) ----------
  // Al bloquear y desbloquear la tableta, entrar o salir del ahorro de energía o volver de otra app, el navegador
  // congela la página: los relojes internos se detienen, la cámara se suelta y la red tarda en volver. Al regresar se
  // revisa todo: pantalla encendida, reloj al día, y si se quedó a media checada (o vacía) se vuelve al inicio.
  // Varios avisos seguidos (bloquear muchas veces) cuentan como uno solo.
  // 2026-11-12 (Dirección: «otra vez en blanco al desbloquear; tuve que reiniciar la app», y el vigilante no anotó nada:
  // el programa seguía vivo o el navegador no volvió a dibujar). Al volver de un bloqueo de más de 15 s el kiosco hace
  // solo lo que Dirección hacía a mano: se reinicia. Abre al instante con la copia guardada («?copia=1», kiosco-sw.js),
  // así que no depende de que la red ya haya vuelto; por eso solo se hace cuando la caché está al mando de la página.
  const REINICIO_MS = 15000;
  let ocultoDesde = 0, reviviendo = null, ultimaConexion = 0, camaraAntes = false;
  function revivir(motivo = '') {
    clearTimeout(reviviendo);
    reviviendo = setTimeout(() => {
      if (document.visibilityState !== 'visible') return;
      const fuera = ocultoDesde ? Date.now() - ocultoDesde : 0; ocultoDesde = 0;
      if (fuera > REINICIO_MS && !deBaja && registro?.token && navigator.serviceWorker?.controller) { window.__kiosco.cierre('regreso del bloqueo'); location.replace('/kiosco?copia=1'); return; }
      despierta(); tic(); buscarLectorQR();
      // Forzar a redibujar: en algunas tabletas la página vuelve en blanco hasta que algo cambia en pantalla.
      document.body.style.transform = 'translateZ(0)'; requestAnimationFrame(() => { document.body.style.transform = ''; });
      const p = $('pantalla'), vacia = !p.firstElementChild || !!$('arranque') || !p.innerText.trim();
      if (!deBaja && registro?.token && (vacia || motivo === 'vigilante' || (fuera > 15000 && !estado.esCodigo))) inicio();
      // La cámara se soltó al ocultarse la pantalla (2026-11-12): si la persona sigue a media checada, se vuelve a
      // prender (antes la siguiente checada salía «Sin foto» y la toma de la cara se quedaba congelada).
      if (camaraAntes) { camaraAntes = false; if (!deBaja && !estado.esCodigo) iniciarCamara(); }
      if (!deBaja && Date.now() - ultimaConexion > 5000) { ultimaConexion = Date.now(); conectar().then(ok => { if (ok && !deBaja) { subirPendientes(); mandarDiagnostico(); } }); }
    }, 350);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revivir(); else { ocultoDesde = ocultoDesde || Date.now(); camaraAntes = camaraAntes || camaraLista || !!pidiendo; soltarCamara(); } });
  window.addEventListener('pageshow', e => { if (e.persisted) revivir(); });
  document.addEventListener('resume', () => revivir());
  window.addEventListener('focus', () => revivir());
  // Lo que anotó el vigilante (pantalla vacía, recargas…) se manda al servidor para verlo en los Logs del sistema.
  async function mandarDiagnostico() {
    let l = []; try { l = JSON.parse(localStorage.getItem('saneadren_kiosco_diag') || '[]'); } catch { l = []; }
    if (!Array.isArray(l) || !l.length) return;
    try { const r = await api('diagnostico', { eventos: l.slice(-10) }); if (r.ok || r.status === 400) localStorage.removeItem('saneadren_kiosco_diag'); } catch { /* después */ }
  }
  // La caché (kiosco-sw.js) avisa cuando bajó una versión nueva de la página: se recarga sola cuando nadie la usa.
  let versionNueva = false;
  navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.kiosco === 'version-nueva') versionNueva = true; });
  setInterval(() => { if (versionNueva && estado.esCodigo && !$('pantalla').querySelector('.digitos')?.textContent.match(/\d/) && document.visibilityState === 'visible') { versionNueva = false; window.__kiosco.cierre('versión nueva'); location.reload(); } }, 15000);
  window.addEventListener('online', async () => { if (!deBaja && await conectar()) subirPendientes(); });
  window.addEventListener('offline', () => { sinConexion = true; avisos(); });
  // Un kiosco no conserva la sesión del CRM: si el gerente la dejó abierta al registrarlo (o alguien entra en otra
  // pestaña), se cierra aquí para que nadie use esta tableta para entrar al sistema. Misma llave que app.js.
  function cerrarSesionCrm() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem('usuario_actual') || 'null'); localStorage.removeItem('usuario_actual'); } catch { /* sin almacenamiento */ }
    if (s?.token) fetch('/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + s.token }, cache: 'no-store' }).catch(() => {});
  }
  if (registro?.token) {
    cerrarSesionCrm();
    window.addEventListener('storage', e => { if (e.key === 'usuario_actual' && e.newValue) cerrarSesionCrm(); });
  }
  // El vigilante (arriba) puede pedir volver al inicio sin recargar.
  window.__kiosco.revivir = () => { ocultoDesde = 0; clearTimeout(reviviendo); if (!deBaja && registro?.token) inicio(); revivir('vigilante'); };
  (async () => {
    if (!registro?.token) { noRegistrado(); window.__kiosco.listo = true; return; }
    // Primero la pantalla (2026-11-11): el teclado sale de inmediato y el servidor se consulta por detrás. Antes se
    // esperaba al servidor sin límite y, si la red no contestaba, la pantalla se quedaba vacía.
    avisos(); inicio(); window.__kiosco.listo = true; tiempos.abrir = performance.now(); despierta(); contarPendientes();
    // Que el navegador no borre por su cuenta lo guardado aquí (el registro del kiosco y las checadas sin subir).
    try { navigator.storage?.persist?.().catch(() => {}); } catch { /* no disponible */ }
    ultimaConexion = Date.now();
    if (!await conectar()) return;
    // Al abrir se pide la cámara una vez (para que el permiso quede dado) y se apaga hasta que alguien cheque.
    iniciarCamara().then(() => { if (estado.esCodigo) soltarCamara(); }); subirPendientes(); mandarDiagnostico();
    // Reconocimiento y prueba de vida, listos en segundo plano. 2026-11-13: solo si alguien de la sucursal entra con la
    // cara (si nadie, son 22 MB y varios segundos de procesador que la tableta gastaba en cada apertura para nada; se
    // cargan igual, en el momento, si alguien registra su cara), y uno después del otro para no trabar la pantalla.
    setTimeout(async () => {
      if (hayCaras) {
        let t0 = performance.now(); try { await cargarFaceApi(); tiempos.cara = performance.now() - t0; } catch { /* se reintenta al usarla */ }
        t0 = performance.now(); try { await cargarAntispoof(); tiempos.vida = performance.now() - t0; } catch { /* se reintenta al usarla */ }
      }
      setTimeout(velocidadAlAbrir, hayCaras ? 5000 : 35000);
    }, 5000);
    setInterval(async () => {
      if (document.visibilityState !== 'visible' || deBaja) return;
      despierta(); // el sistema puede soltar «pantalla encendida» (p. ej. con poca batería): se vuelve a pedir cada minuto
      // La cámara falló y nadie está checando: se prueba sola otra vez (si ya sirve, el aviso se quita sin que nadie lo toque).
      if (camaraFallo && estado.esCodigo) iniciarCamara().then(() => { if (estado.esCodigo) soltarCamara(); });
      if (await conectar()) { subirPendientes(); mandarDiagnostico(); }
    }, 60000);
  })();
})();
</script>
